name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.100.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-musl

      - name: Verify package version matches tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match MAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml version ${package_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ubuntu-26.04-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Install nextest
        run: cargo install cargo-nextest --version 0.9.133 --locked

      - name: Validate bundled seccomp profile
        run: |
          cargo package --locked --list | grep -Fx seccomp-landlock.json
          jq -e '
            ["landlock_add_rule", "landlock_create_ruleset", "landlock_restrict_self"] -
            [.syscalls[] | select(.action == "SCMP_ACT_ALLOW" and
              (.args | length) == 0 and (.includes | length) == 0 and (.excludes | length) == 0)
             | .names[]?] == []
          ' seccomp-landlock.json >/dev/null
          test -s seccomp-landlock.upstream.sha

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check
        run: cargo check --all-features --locked

      - name: Run tests
        env:
          TINO_TEST_REQUIRE_LANDLOCK: '1'
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker=rust-lld
        run: |
          cargo nextest run --all-features --locked
          cargo nextest run --all-features --locked --target x86_64-unknown-linux-musl

      - name: Run doc tests
        run: cargo test --doc --all-features --locked

      - name: Verify package
        run: cargo package --locked

  container-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build scratch image
        run: docker build --target runtime -t tino:e2e .

      - name: Verify scratch image entrypoint
        run: docker run --rm tino:e2e --help

      - name: Build shell test image
        run: |
          docker build -t tino:e2e-shell -f - . <<'EOF'
          FROM tino:e2e AS tino
          FROM alpine:3.23
          COPY --from=tino /sbin/tino /sbin/tino
          RUN mkdir -p /data/logs
          ENTRYPOINT ["/sbin/tino"]
          EOF

      - name: Verify config creation and replacement permissions
        run: |
          profile="$RUNNER_TEMP/config-seccomp.json"
          jq '.syscalls[].names -= ["fsetxattr", "fremovexattr"]' seccomp-landlock.json > "$profile"
          docker run --rm --security-opt "seccomp=$profile" \
            --user 65534:65534 --tmpfs /etc/tino:uid=65534,gid=65534,mode=0700 \
            --entrypoint /bin/sh tino:e2e-shell -ec '
              config=/etc/tino/tino.conf
              umask 077
              /sbin/tino --write-config
              test "$(stat -c %a "$config")" = 600
              chmod 200 "$config"
              /sbin/tino --write-config --subreaper
              test ! -r "$config"
              chmod 600 "$config"
              test "$(cat "$config")" = subreaper
              chmod 300 /etc/tino
              status=0
              /sbin/tino --write-config --pgroup-kill || status=$?
              test "$status" = 1
              test "$(cat "$config")" = subreaper
            '

      - name: Verify PID 1 waits for workers after a stop signal
        run: |
          # PID 1 adopts orphans even when PR_SET/GET_CHILD_SUBREAPER (36/37) are blocked.
          profile="$RUNNER_TEMP/pid1-seccomp.json"
          jq '.syscalls[].names -= ["prctl"] | .syscalls += [
            {op:"SCMP_CMP_LT", value:36}, {op:"SCMP_CMP_GT", value:37} |
            {names:["prctl"], action:"SCMP_ACT_ALLOW", args:[. + {index:0}]}
          ]' seccomp-landlock.json > "$profile"
          output=$(docker run --rm --security-opt "seccomp=$profile" tino:e2e-shell -s -e 42 -- sh -ec '
            mkfifo /tmp/stop-worker
            (read -r stop < /tmp/stop-worker && sleep 1 && echo drained) &
            trap "echo stop > /tmp/stop-worker; exit 42" TERM
            kill -TERM 1
            wait
          ')
          test "$output" = drained

      - name: Verify Landlock with Docker seccomp
        run: |
          seccomp_profile="$(pwd)/seccomp-landlock.json"

          docker run --rm --security-opt "seccomp=${seccomp_profile}" \
            --entrypoint /bin/sh tino:e2e-shell -ec '
              mkdir -p /usr/local/bin
              printf "%s\n" "#!/bin/sh" "exit 42" > /usr/local/bin/tino-path-probe
              printf "%s\n" "#!/usr/bin/env tino-path-probe" > /tmp/tino-entry
              chmod +x /usr/local/bin/tino-path-probe /tmp/tino-entry
              unset PATH
              /sbin/tino -e 42 --exec-allow /bin/sh -- tino-path-probe
              /sbin/tino -e 42 --exec-allow tino-path-probe -- tino-path-probe
              /sbin/tino -e 42 --exec-allow /bin/sh -- /tmp/tino-entry
            '

          docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo ok > /data/logs/ok && test "$(cat /data/logs/ok)" = ok'

          status=0
          docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo denied > /tmp/deny || exit 42' || status=$?
          if [ "$status" -ne 42 ]; then
            echo "expected the denied write to exit 42, got $status" >&2
            exit 1
          fi

      - name: Check startup when Landlock is unavailable
        run: |
          profile="$RUNNER_TEMP/landlock-unavailable.json"
          jq '.syscalls[].names -= ["landlock_create_ruleset"]' seccomp-landlock.json > "$profile"
          status=0
          docker run --rm --security-opt "seccomp=$profile" tino:e2e-shell \
            --write-restrict -e 1 -- /bin/true || status=$?
          test "$status" -eq 1
          docker run --rm --security-opt "seccomp=$profile" tino:e2e-shell \
            --write-restrict --restrict-warn-only -- /bin/true

  docker-publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: container-e2e
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml

  binary-release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: container-e2e
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release.yaml
