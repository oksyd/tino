name: CI

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Verify package version matches tag
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match MAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          package_id="$(cargo pkgid --locked)"
          package_version="${package_id##*#}"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml version ${package_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ubuntu-26.04-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Install nextest
        run: cargo install cargo-nextest --version 0.9.133 --locked

      - name: Validate bundled seccomp profile
        run: |
          python3 -c "import json; json.load(open('seccomp-landlock.json', encoding='utf-8')); print('seccomp-landlock.json OK')"
          test -s seccomp-landlock.upstream.sha

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check
        run: cargo check --all-features --locked

      - name: Run tests
        run: cargo nextest run --all-features --locked

      - name: Run doc tests
        run: cargo test --doc --all-features --locked

      - name: Verify package
        run: cargo package --locked

  container-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build scratch image
        run: docker build --target runtime -t tino:e2e .

      - name: Verify scratch image entrypoint
        run: docker run --rm tino:e2e --help

      - name: Build shell test image
        run: |
          docker build -t tino:e2e-shell -f - . <<'EOF'
          FROM tino:e2e AS tino
          FROM alpine:3.23
          COPY --from=tino /sbin/tino /sbin/tino
          RUN mkdir -p /data/logs
          ENTRYPOINT ["/sbin/tino"]
          EOF

      - name: Verify Landlock with Docker seccomp
        run: |
          seccomp_profile="$(pwd)/seccomp-landlock.json"
          deny_stdout="$(mktemp)"
          deny_stderr="$(mktemp)"

          docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo ok > /data/logs/ok && test "$(cat /data/logs/ok)" = ok'

          if docker run --rm \
            --security-opt "seccomp=${seccomp_profile}" \
            tino:e2e-shell \
            --write-restrict --write-allow /data/logs -- \
            sh -c 'echo denied > /tmp/deny' >"$deny_stdout" 2>"$deny_stderr"; then
            echo "expected write outside /data/logs to fail" >&2
            cat "$deny_stdout" >&2
            cat "$deny_stderr" >&2
            exit 1
          fi
