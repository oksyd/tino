name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: tino

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            asset-suffix: linux-x86_64-gnu
            use-cross: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
            asset-suffix: linux-x86_64-musl
            use-cross: true
          - os: ubuntu-24.04
            target: arm-unknown-linux-gnueabihf
            platform: linux/arm/v6
            asset-suffix: linux-arm-gnueabihf
            use-cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
            asset-suffix: linux-aarch64-musl
            use-cross: true
          - os: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            asset-suffix: linux-armv7-gnueabihf
            use-cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match MAJOR.MINOR.PATCH: ${VERSION}" >&2
            exit 1
          fi
          echo "PROJECT_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'

      - name: Verify package version matches tag
        shell: bash
        run: |
          package_id="$(cargo pkgid --locked)"
          package_version="${package_id##*#}"
          if [ "$package_version" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "Cargo.toml version ${package_version} does not match tag ${{ steps.version.outputs.VERSION }}" >&2
            exit 1
          fi

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ matrix.target }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Setup native compilation
        if: ${{ matrix.use-cross == false }}
        shell: bash
        run: echo "CARGO=cargo" >> "$GITHUB_ENV"

      - name: Setup cross compilation
        if: ${{ matrix.use-cross == true }}
        shell: bash
        run: |
          dir="$RUNNER_TEMP/cross"
          mkdir -p "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          cd "$dir"
          cross_version="v0.2.5"
          cross_sha256="a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588"
          curl -LSf -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/${cross_version}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "${cross_sha256}  cross.tar.gz" | sha256sum -c -
          tar xf cross.tar.gz
          echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          : "${CARGO:=cargo}"
          $CARGO build --locked --release --target ${{ matrix.target }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "BIN_NAME=${{ env.PROJECT }}.exe" >> "$GITHUB_ENV"
          else
            echo "BIN_NAME=${{ env.PROJECT }}" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          staging="${{ env.PROJECT }}-${{ env.PROJECT_VERSION }}-${{ matrix.asset-suffix }}"
          mkdir "$staging"
          cp README.md LICENSE "$staging/"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$staging/"
          asset="out/${staging}.tar.gz"
          tar czf "$asset" "$staging"
          sbom="out/${staging}.spdx.json"
          {
            echo "STAGING_DIR=$staging"
            echo "ASSET=$asset"
            echo "SBOM=$sbom"
          } >> "$GITHUB_ENV"

      - name: Generate SBOM
        shell: bash
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL -o "$archive" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" "dir:$STAGING_DIR" -o "spdx-json=$SBOM"

      - name: Generate provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - name: Generate SBOM file provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.SBOM }}

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match MAJOR.MINOR.PATCH: ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "PROJECT_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          tmpfile="$(mktemp)"
          while IFS= read -r -d '' file; do
            line="$(sha256sum "$file")"
            hash="${line%% *}"
            printf '%s  %s\n' "$hash" "$(basename "$file")"
          done < <(
            find . -maxdepth 2 -type f ! -name SHA256SUMS -print0 | sort -z
          ) > "$tmpfile"
          mv "$tmpfile" SHA256SUMS

      - name: Generate changelog
        shell: bash
        run: |
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl -fsSL -o "$archive" https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/git-cliff-2.14.2/git-cliff" --latest --tag '${{ steps.version.outputs.VERSION }}' --strip header --output RELEASE_NOTES.md

      - name: Append release metadata
        shell: bash
        run: |
          {
            echo
            echo '## Supported Platforms'
            echo
            echo '| OCI platform | Rust target | Release asset |'
            echo '| --- | --- | --- |'
            echo "| \`linux/amd64\` | \`x86_64-unknown-linux-gnu\` | \`tino-${{ env.PROJECT_VERSION }}-linux-x86_64-gnu.tar.gz\` |"
            echo "| \`linux/amd64\` | \`x86_64-unknown-linux-musl\` | \`tino-${{ env.PROJECT_VERSION }}-linux-x86_64-musl.tar.gz\` |"
            echo "| \`linux/arm64\` | \`aarch64-unknown-linux-musl\` | \`tino-${{ env.PROJECT_VERSION }}-linux-aarch64-musl.tar.gz\` |"
            echo "| \`linux/arm/v6\` | \`arm-unknown-linux-gnueabihf\` | \`tino-${{ env.PROJECT_VERSION }}-linux-arm-gnueabihf.tar.gz\` |"
            echo "| \`linux/arm/v7\` | \`armv7-unknown-linux-gnueabihf\` | \`tino-${{ env.PROJECT_VERSION }}-linux-armv7-gnueabihf.tar.gz\` |"
            echo
            echo '## Archive Layout'
            echo
            echo 'All release archives use a single top-level directory:'
            echo
            echo '```text'
            echo 'tino-<version>-<os>-<arch>-<abi>/'
            echo '├── tino'
            echo '├── LICENSE'
            echo '└── README.md'
            echo '```'
            echo
            echo '## Verification'
            echo
            echo 'The SPDX predicate type below is an identifier used by GitHub attestations, not a browsable documentation URL.'
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo "gh attestation verify PATH/TO/ARTIFACT -R ${GITHUB_REPOSITORY}"
            echo "gh attestation verify PATH/TO/ARTIFACT -R ${GITHUB_REPOSITORY} --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.VERSION }}"
          title="tino ${tag}"
          mapfile -t assets < <(find dist -maxdepth 2 -type f | sort)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" --title "$title" --notes-file RELEASE_NOTES.md
