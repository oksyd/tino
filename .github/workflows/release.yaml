name: Release

on:
  workflow_call:

permissions:
  contents: read

env:
  PROJECT: tino

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      target-count: ${{ strategy.job-total }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            asset-suffix: linux-x86_64-gnu
            builder: cargo
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            platform: linux/amd64
            asset-suffix: linux-x86_64-musl
            builder: cross
          - os: ubuntu-26.04
            target: arm-unknown-linux-gnueabihf
            platform: linux/arm/v6
            asset-suffix: linux-arm-gnueabihf
            builder: cross
          - os: ubuntu-26.04
            target: aarch64-unknown-linux-musl
            platform: linux/arm64
            asset-suffix: linux-aarch64-musl
            builder: cross
          - os: ubuntu-26.04
            target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            asset-suffix: linux-armv7-gnueabihf
            builder: cross

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'

      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Setup cross compilation
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/cross"
          mkdir -p "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          cd "$dir"
          cross_version="v0.2.5"
          cross_sha256="a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588"
          curl -LSf -o cross.tar.gz "https://github.com/cross-rs/cross/releases/download/${cross_version}/cross-x86_64-unknown-linux-musl.tar.gz"
          echo "${cross_sha256}  cross.tar.gz" | sha256sum -c -
          tar xf cross.tar.gz

      - name: Build
        shell: bash
        run: ${{ matrix.builder }} build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          staging="${{ env.PROJECT }}-${GITHUB_REF_NAME}-${{ matrix.asset-suffix }}"
          mkdir "$staging"
          cp -R README.md LICENSE assets seccomp-landlock.json "$staging/"
          cp "target/${{ matrix.target }}/release/$PROJECT" "$staging/"
          asset="out/${staging}.tar.gz"
          tar czf "$asset" "$staging"
          sbom="out/${staging}.spdx.json"
          {
            echo "STAGING_DIR=$staging"
            echo "ASSET=$asset"
            echo "SBOM=$sbom"
          } >> "$GITHUB_ENV"

      - name: Generate SBOM
        shell: bash
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL -o "$archive" https://github.com/anchore/syft/releases/download/v1.52.0/syft_1.52.0_linux_amd64.tar.gz
          echo "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" "dir:$STAGING_DIR" -o "spdx-json=$SBOM"

      - name: Generate provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Generate SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      - name: Generate SBOM file provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.SBOM }}

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}

  release:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        env:
          EXPECTED_TARGETS: ${{ needs.build.outputs.target-count }}
        run: |
          shopt -s nullglob
          archives=(*.tar.gz)
          sboms=(*.spdx.json)
          if [[ ${#archives[@]} != "$EXPECTED_TARGETS" || ${#sboms[@]} != "$EXPECTED_TARGETS" ]]; then
            echo "expected $EXPECTED_TARGETS archive/SBOM pairs, found ${#archives[@]} archives and ${#sboms[@]} SBOMs" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            sha256sum "$archive" "${archive%.tar.gz}.spdx.json"
          done > SHA256SUMS

      - name: Generate changelog
        shell: bash
        run: |
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl -fsSL -o "$archive" https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/git-cliff-2.14.2/git-cliff" --latest --use-branch-tags \
            --tag-pattern '^[0-9]+\.[0-9]+\.[0-9]+$' --strip header --output RELEASE_NOTES.md

      - name: Append release metadata
        shell: bash
        run: |
          {
            echo
            echo '## Supported Platforms'
            echo
            echo '| OCI platform | Rust target | Release asset |'
            echo '| --- | --- | --- |'
            echo "| \`linux/amd64\` | \`x86_64-unknown-linux-gnu\` | \`tino-${GITHUB_REF_NAME}-linux-x86_64-gnu.tar.gz\` |"
            echo "| \`linux/amd64\` | \`x86_64-unknown-linux-musl\` | \`tino-${GITHUB_REF_NAME}-linux-x86_64-musl.tar.gz\` |"
            echo "| \`linux/arm64\` | \`aarch64-unknown-linux-musl\` | \`tino-${GITHUB_REF_NAME}-linux-aarch64-musl.tar.gz\` |"
            echo "| \`linux/arm/v6\` | \`arm-unknown-linux-gnueabihf\` | \`tino-${GITHUB_REF_NAME}-linux-arm-gnueabihf.tar.gz\` |"
            echo "| \`linux/arm/v7\` | \`armv7-unknown-linux-gnueabihf\` | \`tino-${GITHUB_REF_NAME}-linux-armv7-gnueabihf.tar.gz\` |"
            echo
            echo '## Archive Layout'
            echo
            echo 'All release archives use a single top-level directory:'
            echo
            echo '```text'
            echo 'tino-<version>-<os>-<arch>-<abi>/'
            echo '├── tino'
            echo '├── LICENSE'
            echo '├── README.md'
            echo '├── assets/logo.svg'
            echo '└── seccomp-landlock.json'
            echo '```'
            echo
            echo '## Verification'
            echo
            echo 'The SPDX predicate type below is an identifier used by GitHub attestations, not a browsable documentation URL.'
            echo
            echo '```bash'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo "gh attestation verify PATH/TO/ARTIFACT -R ${GITHUB_REPOSITORY}"
            echo "gh attestation verify PATH/TO/ARTIFACT -R ${GITHUB_REPOSITORY} --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          title="tino ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS \
            --verify-tag --title "$title" --notes-file RELEASE_NOTES.md
