name: Docker Publish

on:
  workflow_call:

permissions:
  contents: read

env:
  CONTEXT: .
  GHCR_IMAGE: ghcr.io/oksyd/tino

jobs:
  prepare:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate image version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image tag must match MAJOR.MINOR.PATCH: ${version}" >&2
            exit 1
          fi

          package_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          if [ "$package_version" != "$version" ]; then
            echo "Cargo.toml version ${package_version} does not match image tag ${version}" >&2
            exit 1
          fi

  build:
    needs: prepare
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tino-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tino-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - prepare
      - build
    name: manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Read tags and publish under the same lock so slower old builds cannot
    # overwrite latest. Keep all version publications queued.
    concurrency:
      group: tino-image-manifest
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout current tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          latest_version="$(
            git tag --list \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"
          tag_args=(--tag "${GHCR_IMAGE}:${version}")
          if [ "$version" = "$latest_version" ]; then
            tag_args+=(--tag "${GHCR_IMAGE}:latest")
          fi

          sources=()
          while IFS= read -r digest_file; do
            digest="$(basename "$digest_file")"
            sources+=("${GHCR_IMAGE}@sha256:${digest}")
          done < <(find "${RUNNER_TEMP}/digests" -type f -printf '%p\n' | sort)

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "no image digests found" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
