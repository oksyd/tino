# GitHub-hosted labels missing from actionlint v1.7.12's built-in list.
# Remove these entries once actionlint recognizes Ubuntu 26.04.
# https://github.com/actions/runner-images#available-images
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

# actionlint v1.7.12 predates GitHub's concurrency queue setting.
# Remove this exception once actionlint supports it.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
paths:
  .github/workflows/docker.yaml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
