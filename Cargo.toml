[package]
name = "tino"
description = "tino: tiny init process (PID 1) for Docker/Kubernetes containers, written in Rust (tini alternative)"
version = "0.1.39"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/oksyd/tino"
documentation = "https://docs.rs/tino"
readme = "README.md"
keywords = ["init", "pid1", "container", "docker", "tini"]
categories = ["command-line-utilities", "os::unix-apis"]
include = [
  "src/**",
  "benches/**",
  "assets/**",
  "seccomp-landlock.json",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[dependencies]
osarg = { version = "0.1.4", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", default-features = false }

[[bench]]
name = "logic_paths"
path = "benches/logic_paths.rs"
harness = false

[[test]]
name = "signal_state"
path = "tests/signal_state.rs"
harness = false

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1

[package.metadata.release]
push = true
publish = false
verify = true
sign-commit = true
sign-tag = true
allow-branch = ["main"]
tag-prefix = ""
tag-name = "{{prefix}}{{version}}"
tag-message = "chore: release {{crate_name}} version {{version}}"
pre-release-commit-message = "chore: release {{crate_name}} version {{version}}"
pre-release-hook = ["git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}"]

[lints.rust]
raw_borrows_via_references = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
